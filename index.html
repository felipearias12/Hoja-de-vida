<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoja de vida</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            background-color: #ffffff;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        h1, h2 {
            color: #333333;
            margin-bottom: 10px;
        }
        p {
            color: #555555;
            line-height: 1.6;
        }
        .section {
            margin-bottom: 24px;
        }
        .skills {
            list-style: none;
            padding: 0;
        }
        .skills li {
            background: #f7f7f7;
            margin: 6px 0;
            padding: 10px;
            border-radius: 6px;
        }
        .github-link {
            display: inline-block;
            margin-top: 12px;
            text-decoration: none;
            color: #ffffff;
            background-color: #24292f;
            padding: 10px 16px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="section">
            <h1>Nombre Apellido</h1>
            <p>Carrera: Ingeniería de Sistemas</p>
            <p>Semestre: 6</p>
        </header>

        <section class="section">
            <h2>Habilidades / Tecnologías</h2>
            <ul class="skills">
                <li>HTML y CSS</li>
                <li>JavaScript</li>
                <li>Git y GitHub</li>
                <li>Trabajo en equipo</li>
            </ul>
        </section>

        <section class="section">
            <h2>Enlace a GitHub</h2>
            <p>Aquí puedes agregar tu enlace de GitHub después:</p>
            <a class="github-link" href="#" target="_blank">Mi perfil de GitHub</a>
        </section>
    </div>
</body>
</html>
